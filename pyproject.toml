[project]
name = "assistente-ia"
version = "0.1.0"
description = "Um assistente de IA para uma fabrica de equipamentos industriais"
authors = [
    {name = "Bruna Vitor",email = "brunavitor23@outlook.com"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0.0"
dependencies = [
    "langgraph (>=1.1.2,<2.0.0)",
    "langchain (>=1.2.12,<2.0.0)",
    "langchain-google-genai (>=4.2.1,<5.0.0)",
    "dotenv (>=0.9.9,<0.10.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
