[project]
name = "assistente-ia"
version = "0.1.0"
description = "Um assistente de IA para uma fabrica de equipamentos industriais"
authors = [
    {name = "Bruna Vitor",email = "brunavitor23@outlook.com"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0.0"
dependencies = [
    "langgraph (>=1.1.2,<2.0.0)",
    "langchain (>=1.2.12,<2.0.0)",
    "langchain-google-genai (>=4.2.1,<5.0.0)",
    "dotenv (>=0.9.9,<0.10.0)",
    "langchain-community (>=0.4.1,<0.5.0)",
    "pypdf (>=4.0.0,<5.0.0)",
    "torch (==2.2.2)",
    "pandas (>=3.0.1,<4.0.0)",
    "langchain-huggingface (>=1.2.1,<2.0.0)",
    "huggingface-hub (>=1.7.2,<2.0.0)",
    "sentence-transformers (>=5.3.0,<6.0.0)",
    "openpyxl (>=3.1.5,<4.0.0)",
    "pdfminer-six (>=20260107,<20260108)",
    "numpy (>=2.4.4,<3.0.0)",  
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[dependency-groups]
dev = [
    "ipykernel (>=7.2.0,<8.0.0)"
]
